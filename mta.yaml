
_schema-version: 3.3.0
ID: Meritlens
version: 1.0.0
description: "MeritLens CAP backend"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: Meritlens-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    requires:
      - name: Meritlens-auth
      - name: Meritlens-db

  - name: Meritlens-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 256M
      disk-quota: 512M
      env:
        TENANT_HOST_PATTERN: '^(.*)-dev-meritlens-approuter\.cfapps\.ap21\.hana\.ondemand\.com$'
    build-parameters:
      builder: npm-ci
    requires:
      - name: Meritlens-auth
      - name: Meritlens-destination

  - name: Meritlens-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Meritlens-db

resources:
  - name: Meritlens-auth
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: meritlens-xsuaa

  - name: Meritlens-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: meritlens-hdi

  - name: Meritlens-destination
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: career-meritlens-destination

